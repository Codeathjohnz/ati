services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${DB_DATABASE:-ati_caraga}
      MYSQL_USER: ${DB_USERNAME:-ati}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - ati_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-changeme_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "Digital Trainee Tracker"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ati_caraga}
      DB_USERNAME: ${DB_USERNAME:-ati}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ati-caraga.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    volumes:
      - ati_backend_storage:/var/www/html/storage
    expose:
      - "80"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  ati_mysql_data:
  ati_backend_storage:
